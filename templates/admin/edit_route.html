{% extends "admin/base.html" %}

{% block title %}FareCal Admin — Edit Route{% endblock %}

{% block content %}

{% from "partials/back_button.html" import back_button %}
{{ back_button(url_for('admin.routes'), 'Back to Routes') }}

<h1 class="fs-3 fw-bold mb-4">Edit Route</h1>

<div class="card border-0 shadow-sm" style="max-width: 720px;">
    <div class="card-header bg-white fw-bold">Route Details</div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.edit_route', route_id=row.id) }}" class="row g-3">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <div class="col-md-4">
                <label class="form-label" for="transport_type_id">Transportation *</label>
                <select id="transport_type_id" name="transport_type_id" class="form-select" required>
                    {% for transport in transports %}
                        <option value="{{ transport.id }}"
                                {{ 'selected' if transport.id == row.transport_type_id else '' }}>
                            {{ transport.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label" for="origin">Origin *</label>
                <input type="text" class="form-control" id="origin" name="origin"
                       required minlength="2" value="{{ row.origin }}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="destination">Destination *</label>
                <input type="text" class="form-control" id="destination" name="destination"
                       required minlength="2" value="{{ row.destination }}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="distance_km">Distance (km) *</label>
                <input type="number" class="form-control" id="distance_km" name="distance_km"
                       required min="0.01" max="500" step="0.01" value="{{ row.distance_km }}">
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
