{% extends "admin/base.html" %}

{% block title %}FareCal Admin — Edit Fare Rate{% endblock %}

{% block content %}

{% from "partials/back_button.html" import back_button %}
{{ back_button(url_for('admin.fare_rates'), 'Back to Fare Rates') }}

<h1 class="fs-3 fw-bold mb-4">Edit Fare Rate</h1>

<div class="card border-0 shadow-sm" style="max-width: 760px;">
    <div class="card-header bg-white fw-bold">Fare Rate Details</div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.edit_fare_rate', fr_id=row.id) }}" class="row g-3">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <div class="col-md-6">
                <label class="form-label" for="transport_type_id">Transport Type *</label>
                <select class="form-select" id="transport_type_id" name="transport_type_id" required>
                    {% for t in transports %}
                        <option value="{{ t.id }}" {{ 'selected' if t.id == row.transport_type_id else '' }}>
                            {{ t.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="fare_method">Fare Method *</label>
                <select class="form-select" id="fare_method" name="fare_method" required>
                    <option value="base_succeeding" {{ 'selected' if row.fare_method == 'base_succeeding' else '' }}>
                        Base + succeeding
                    </option>
                    <option value="per_km" {{ 'selected' if row.fare_method == 'per_km' else '' }}>
                        Fixed per-km rate
                    </option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label" for="effective_date">Effective Date *</label>
                <input type="date" class="form-control" id="effective_date"
                       name="effective_date" value="{{ row.effective_date.strftime('%Y-%m-%d') }}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label" for="expiration_date">Expiration Date</label>
                <input type="date" class="form-control" id="expiration_date" name="expiration_date"
                       value="{{ row.expiration_date.strftime('%Y-%m-%d') if row.expiration_date else '' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="status">Status</label>
                <select class="form-select" id="status" name="status">
                    <option value="active" {{ 'selected' if row.status == 'active' else '' }}>Active</option>
                    <option value="inactive" {{ 'selected' if row.status == 'inactive' else '' }}>Inactive</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label" for="base_distance">Base Distance (km)</label>
                <input type="number" class="form-control" id="base_distance" name="base_distance"
                       min="0" step="0.01" value="{{ row.base_distance or '' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="base_fare">Base Fare (₱)</label>
                <input type="number" class="form-control" id="base_fare" name="base_fare"
                       min="0" step="0.01" value="{{ row.base_fare or '' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="succeeding_rate">Succeeding Rate (₱/km)</label>
                <input type="number" class="form-control" id="succeeding_rate"
                       name="succeeding_rate" min="0" step="0.01" value="{{ row.succeeding_rate or '' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="per_km_rate">Per-km Rate (₱/km)</label>
                <input type="number" class="form-control" id="per_km_rate" name="per_km_rate"
                       min="0" step="0.01" value="{{ row.per_km_rate or '' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="minimum_fare">Min Fare (₱)</label>
                <input type="number" class="form-control" id="minimum_fare" name="minimum_fare"
                       min="0" step="0.01" value="{{ row.minimum_fare or '' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label" for="maximum_fare">Max Fare (₱)</label>
                <input type="number" class="form-control" id="maximum_fare" name="maximum_fare"
                       min="0" step="0.01" value="{{ row.maximum_fare or '' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="rounding_rule">Rounding Rule</label>
                <select class="form-select" id="rounding_rule" name="rounding_rule">
                    {% for rule in rounding_rules %}
                        <option value="{{ rule }}" {{ 'selected' if rule == row.rounding_rule else '' }}>
                            {{ rule }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="source_reference">Source Reference</label>
                <input type="text" class="form-control" id="source_reference"
                       name="source_reference" value="{{ row.source_reference or '' }}">
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
