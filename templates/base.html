<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FareCal{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark app-header">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <svg class="brand-bus" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="3" width="16" height="17" rx="2"/><line x1="8" y1="20" x2="8" y2="22"/><line x1="16" y1="20" x2="16" y2="22"/><rect x="6" y="10" width="12" height="3"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/>
                </svg>
                FareCal
            </a>
        </div>
    </nav>

    <main class="{% block main_class %}container py-4{% endblock %} flex-grow-1">
        {% include "_flashes.html" %}
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer py-3 mt-auto">
        <div class="container text-center small">
            <p class="mb-1">FareCal — Web-Based Public Transportation Fare Calculator</p>
            <p class="mb-0 text-muted">Estimated fares only. Actual fares may vary per applicable regulations.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
